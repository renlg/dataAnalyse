server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:./data/dataanalyse;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
      continue-on-error: false
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
dataanalyse:
  secret: ${DATA_ANALYSE_SECRET:dataAnalyse-dev-secret-change-me}
